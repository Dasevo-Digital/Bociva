#!/usr/sbin/nft -f
# Bociva hinter Nginx Proxy Manager: Nur der Proxy (und der Container selbst,
# für die Prüfung) erreicht Port 8770. Mit BOCIVA_TRUST_PROXY=true darf sonst
# niemand direkt mit dem Server sprechen. Proxy-Adresse anpassen, dann:
#   install -m 0644 nftables.conf /etc/nftables.conf && systemctl enable --now nftables
flush ruleset

define proxy = 192.168.1.10

table inet bociva {
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport 8770 ip saddr { 127.0.0.1, $proxy } accept
    tcp dport 8770 ip6 saddr ::1 accept
    tcp dport 8770 drop
  }
}
